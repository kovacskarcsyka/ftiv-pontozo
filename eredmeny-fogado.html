<!DOCTYPE html>
<html lang="hu">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Eredmény fogadó</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>

        body {

            font-family: Arial, sans-serif;
            padding: 20px;

        }
        table {

            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;

        }

        th, td {

            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;

        }

        th {
            background: #eee;
        }

    </style>

</head>
<body>

<h1>Eredmény fogadó</h1>

<div id="reader"></div>

<button id="rangsorBtn">
    🏆 Rangsor
</button>
<button id="rangsorExcelBtn">
    📊 Rangsor Excel
</button>
<table id="tabla">

    <thead>

<tr>
   <th>FTIV</th>
   <th>Név</th>
   <th>Nem</th>
   <th>Korosztály</th>
   <th>Kategória</th>
   <th>Pont</th>
</tr>

    </thead>

    <tbody>
    </tbody>

</table>

<script>
    let excelAdatok = [];
    let munkafuzet = null;
    let munkalapNev = "";
    let marBeolvasottQr = [];
function onScanSuccess(text) {

    if (marBeolvasottQr.includes(text)) {

        alert(
            "Ez a csapat már be lett olvasva!"
        );

        return;
    }

    marBeolvasottQr.push(text);

    let sorok =
        text.split(";")
            .filter(s => s.trim() !== "");

    let tbody =
        document.querySelector(
            "#tabla tbody"
        );
    sorok.forEach(sor => {

    let adatok =
        sor.split("|");

    let ftiv =
        adatok[0] || "";

    let nev =
        ftiv;
        let nem = "";
        let korosztaly = "";
        let kategoria = "";


     let versenyek =
        JSON.parse(
            localStorage.getItem("versenyek") || "[]"
        );

    versenyek.forEach(v => {

        if (v.nevezok) {

            v.nevezok.forEach(n => {

               if (n.id == ftiv) {

    nev = n.nev;
    nem = n.nem;
    korosztaly = n.korosztaly;
    kategoria = n.kategoria;

}

            });

        }

    });

    let tr =
        document.createElement("tr");

   tr.innerHTML = `
    <td>${ftiv}</td>
    <td>${nev}</td>
    <td>${nem}</td>
    <td>${korosztaly}</td>
    <td>${kategoria}</td>
    <td>${adatok[1] || ""}</td>
`;

    tbody.appendChild(tr);

});

}

const scanner =
    new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,
            qrbox: 700
        }
    );

scanner.render(onScanSuccess);
document
    .getElementById("rangsorBtn")
    .addEventListener(
        "click",
        () => {

            let ablak =
                window.open(
                    "",
                    "_blank"
                );

           let html =
    "<h1>Rangsor</h1>";

let versenyzok = [];

document
    .querySelectorAll(
        "#tabla tbody tr"
    )
    .forEach(tr => {

        versenyzok.push({

    nev:
        tr.children[1].innerText,

    nem:
        tr.children[2].innerText,

    korosztaly:
        tr.children[3].innerText,

    kategoria:
        tr.children[4].innerText,

    pont:
        Number(
            tr.children[5].innerText
        )

});

    });

let csoportok = {};

versenyzok.forEach(v => {

    let kulcs =
        v.nem +
        " | " +
        v.korosztaly +
        " | " +
        v.kategoria;

    if (!csoportok[kulcs]) {

        csoportok[kulcs] = [];

    }

    csoportok[kulcs].push(v);

});

Object.keys(csoportok)
    .forEach(kulcs => {

        html +=
            "<h2>" +
            kulcs +
            "</h2>";

        csoportok[kulcs]
            .sort(
                (a, b) =>
                    b.pont - a.pont
            );

        csoportok[kulcs]
            .forEach(
                (v, index) => {

                   let hely = "";

if (index === 0)
    hely = "🥇 ";

else if (index === 1)
    hely = "🥈 ";

else if (index === 2)
    hely = "🥉 ";

if (index === 0) {

    html +=
        "<table border='1' style='border-collapse:collapse;margin-bottom:20px;width:100%;'>" +
        "<tr>" +
        "<th>Hely</th>" +
        "<th>Név</th>" +
        "<th>Pont</th>" +
        "</tr>";

}

html +=
    "<tr>" +
    "<td>" + hely + (index + 1) + ".</td>" +
    "<td>" + v.nev + "</td>" +
    "<td>" + v.pont + "</td>" +
    "</tr>";

if (index === csoportok[kulcs].length - 1) {

    html += "</table>";

}

                }
            );

    });

ablak.document.write(html);

        }
    );
    document
    .getElementById("rangsorExcelBtn")
    .addEventListener(
        "click",
        () => {

            let versenyzok = [];

            document
                .querySelectorAll(
                    "#tabla tbody tr"
                )
                .forEach(tr => {

                    versenyzok.push({

                        FTIV:
                            tr.children[0].innerText,

                        Nev:
                            tr.children[1].innerText,

                        Nem:
                            tr.children[2].innerText,

                        Korosztaly:
                            tr.children[3].innerText,

                        Kategoria:
                            tr.children[4].innerText,

                        Pont:
                            Number(
                                tr.children[5].innerText
                            )

                    });

                });

            let csoportok = {};

            versenyzok.forEach(v => {

                let kulcs =
                    v.Nem +
                    " | " +
                    v.Korosztaly +
                    " | " +
                    v.Kategoria;

                if (!csoportok[kulcs]) {

                    csoportok[kulcs] = [];

                }

                csoportok[kulcs].push(v);

            });

            let wb =
                XLSX.utils.book_new();

            Object.keys(csoportok)
                .forEach(kulcs => {

                    let lista =
                        csoportok[kulcs];

                    lista.sort(
                        (a, b) =>
                            b.Pont - a.Pont
                    );

                    let excelAdatok =
                        lista.map(
                            (v, index) => ({

                                Hely:
                                    index + 1,

                                FTIV:
                                    v.FTIV,

                                Nev:
                                    v.Nev,

                                Pont:
                                    v.Pont

                            })
                        );

                    let ws =
                        XLSX.utils.json_to_sheet(
                            excelAdatok
                        );

                    let lapNev =
                        kulcs
                            .replace(/[\\\/:*?"<>|]/g, "")
                            .substring(0, 31);

                    XLSX.utils.book_append_sheet(
                        wb,
                        ws,
                        lapNev
                    );

                });

            XLSX.writeFile(
                wb,
                "Rangsor.xlsx"
            );

        }
    );
</script>

</body>
</html>
