<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FTIV Pontozó</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script src="app.js" defer></script>
</head>


<body>
    <img
    id="hatterLogo"
    src="logo.png"
>

<div id="fomenu">
    <h1 id="foCim">
    🏹<br>
    Golden Hawk Score
</h1>

     <button id="versenyModeBtn">
        🏆 VERSENY
     </button>

     <button id="edzesModeBtn">
        🏹 EDZÉS
     </button>
     <button id="mentettEdzesekBtn">
    📚 MENTETT EDZÉSEK
     </button>
     <button id="versenyekBtn">
    📝 VERSENYEK
     </button>
     <button
    id="ujVersenyBtn"
    style="display:none;"
>
    🔐 ADMIN
</button>

</div>
    <h1 id="versenyNev" style="display:none;">
        Verseny betöltése...
    </h1>

    <div id="qrMod" style="display:none;">
        <div id="reader"></div>

        <div id="lista"></div>

        <button id="inditBtn">
            Pontozás indítása
        </button>
    </div>
<div id="edzesMod" style="display:none;">

    <h1>🏹 EDZÉS</h1>

    <label>Edzés neve</label><br>
    <input id="edzesNev" type="text"><br><br>

    <label>Edzés típusa</label><br>
    <select id="edzesTipus">
        <option value="egyeni">Egyéni</option>
        <option value="csoportos">Csoportos</option>
    </select><br><br>

    <label>Célok száma</label><br>
    <input id="edzesCelok" type="number" value="12"><br><br>

    <label>Lövések célonként</label><br>
    <input id="edzesLovesek" type="number" value="3"><br><br>

    <label>Találati értékek</label><br>

<div id="pontValaszto">

</div>

<input
    id="edzesPontok"
    type="hidden"
    value="10,8,5,0">

<br><br>

<div id="egyeniBlokk">

    <label>Lövő neve</label><br>

    <input
        id="edzesLovoNev"
        type="text">

</div>

<div id="csoportosBlokk"
     style="display:none;">

    <label>Edzőtársak</label>

    <div id="edzotarsLista">

    <div class="edzotarsSor">

        <input
            type="text"
            class="edzotarsNev"
            placeholder="Név">

        <button type="button">🗑</button>

    </div>

</div>

    <br>

    <button id="ujEdzotarsBtn">
        + Edzőtárs hozzáadása
    </button>

</div>

    <button id="edzesInditBtn">
        EDZÉS INDÍTÁSA
    </button>

</div>
<div id="mentettEdzesekMod" style="display:none;">

    <h1>📚 Mentett edzések</h1>

    <div id="mentettEdzesLista"></div>

</div>
    <div id="edzesReszletekMod" style="display:none;">

    <h1>🏹 Edzés részletei</h1>

    <div id="edzesReszletek"></div>

    <button id="visszaMentettEdzesekBtn">
        ⬅ Vissza
    </button>
    </div>
    <div id="versenyekMod" style="display:none;">

    <h1>📋 Versenyek</h1>

    <div id="versenyLista"></div>
    </div>

<div id="versenyAdatlapMod" style="display:none;">

    <h1 id="versenyAdatlapNev"></h1>

    <div id="versenyAdatlapLeiras"></div>

<h3 id="nevezokCim">📋 Nevezők</h3>

<div class="nevezoFejlec">

    <div>Név</div>

    <div>Nem</div>

    <div>Korosztály</div>

    <div>Kategória</div>

    <div>Egyesület</div>

</div>

<div id="nevezokLista"></div>


<button id="nevezekBtn">
    📝 NEVEZEK
</button>
<div id="nevezesiUrlap" style="display:none;">

    <br>

    <label>Név</label><br>
    <input id="nevezoNev" type="text"><br><br>

    <label>Nem</label><br>
    <select id="nevezoNem">
        <option>Férfi</option>
        <option>Nő</option>
    </select><br><br>

    <label>Korosztály</label><br>
    <select id="nevezoKorosztaly"></select>
    </select><br><br>

    <label>Kategória</label><br>
    <select id="nevezoKategoria"></select>
    </select><br><br>

    <label>Egyesület</label><br>
    <input id="nevezoEgyesulet" type="text"><br><br>

    <button id="nevezesKuldesBtn">
        ✅ Nevezés elküldése
    </button>
</div>

</div>
<div id="ujVersenyMod" style="display:none;">

    <h1>🏢 Versenyiroda</h1>

<button id="adminUjVersenyBtn">
    ➕ Új verseny
</button>
<button id="adminVersenyekBtn">
    📋 Versenyek kezelése
</button>
<br><br>
<div
    id="adminVersenyLista"
    style="display:none;">
</div>
<br><br>
</div>
<div id="ujVersenyOldal" style="display:none;">

    <h1>➕ Új verseny</h1>

    <button id="visszaAdminBtn">
        ⬅ Vissza
    </button>

    <br><br>
    <label>Verseny neve</label><br>
    <input id="ujVersenyNev" type="text"><br><br>

    <label>Versenykiírás</label><br>
    <textarea
    id="ujVersenyLeiras"
    rows="20"
    style="
        width:700px;
        max-width:95%;
    ">
</textarea>
<br>
    <label>Korosztályok</label><br>
    <input
        id="ujVersenyKorosztalyok"
        type="text"
        placeholder="Gyerek,Ifjúsági,Felnőtt,Veterán">
    <br><br>

    <label>Kategóriák</label><br>
    <input
        id="ujVersenyKategoriak"
        type="text"
        placeholder="Vadászreflex,Barebow,Csigás">
    <br><br>

    <button id="versenyMentesBtn">
        💾 Verseny mentése
    </button>
    </div>
    <div id="adminVersenyOldal" style="display:none;">

    <button id="visszaVersenyirodaBtn">
        ⬅ Vissza
    </button>

    <h1 id="adminVersenyNev"></h1>

    <div id="adminVersenyAdatok"></div>
    <div id="csapatBeosztas" style="display:flex; gap:20px;">
</div>
</div>
</div>
    <div id="pontozoMod" style="display:none;">
        <div id="celNavigacio"></div>
        <div id="versenyzoTabok"></div>
        <div id="versenyzoPanel"></div>
        <div id="statisztika"></div>
        <div id="eredmenyTabla"></div>
        <div class="pontozoGombSor">

    <button id="kilepesBtn">
        🚪 Kilépés
    </button>

    <button id="lezarasBtn">
        🏁 Lezárás
    </button>

</div>

        <div id="qrEredmeny"></div>
    </div>
</div>

</body>
</html>
